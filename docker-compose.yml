version: '3.8'
services:
  mongodb:
    image: mongo:6
    container_name: fwwb-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fwwb
  server:
    build: ./server
    container_name: fwwb-server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fwwb
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      - mongodb
  client:
    build: ./client
    container_name: fwwb-client
    ports:
      - "3000:80"
    depends_on:
      - server
volumes:
  mongo_data:

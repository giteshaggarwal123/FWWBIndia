# Render Blueprint – FWWB India Backend
# https://render.com/docs/blueprint-spec
# Create a MongoDB Atlas free cluster, then add MONGODB_URI and secrets in Render dashboard.

services:
  - type: web
    name: fwwb-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
